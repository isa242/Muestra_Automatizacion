name: 05 - Despliegue a GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**' ]
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publicar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir carpeta docs/ como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Mostrar URL de la página publicada
        run: |
          echo "Página publicada en: ${{ steps.despliegue.outputs.page_url }}"
