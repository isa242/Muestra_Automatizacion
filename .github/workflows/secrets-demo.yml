name: 03 - Uso de Secrets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verificar-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el Secret está configurado
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # Verificar que el secret no está vacío
          if [ -z "$API_KEY" ]; then
            echo 'ERROR: El secret API_KEY no está configurado'
            exit 1
          fi
          echo 'El secret API_KEY está configurado correctamente.'
          echo "Longitud del valor: ${#API_KEY} caracteres"
          # NUNCA hagas echo del valor directamente: echo $API_KEY
          # GitHub lo enmascara en los logs, pero es mala práctica

      - name: Simular llamada a una API externa
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo 'Iniciando conexión con el servicio externo...'
          echo 'Autenticando con API_KEY...'
          echo 'Conexión exitosa. Proceso completado.'
          # En un proyecto real, aquí iría el comando que usa la clave
          # por ejemplo: curl -H 'Authorization: $API_KEY' https://api.ejemplo.com
