name: 02 - CI Pipeline con Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Analizar la calidad del código (lint)
  lint:
    name: Análisis de calidad de código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar flake8
        run: pip install flake8

      - name: Analizar código con flake8
        run: flake8 app.py test_app.py --max-line-length=100

  # Job 2: Ejecutar tests en múltiples versiones de Python
  test:
    name: Tests - Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Ejecutar tests con reporte de cobertura
        run: pytest test_app.py -v --cov=app --cov-report=xml

      - name: Subir reporte de cobertura como artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
